## Log configuration
log_mode: file
log_dir: /var/log/crowdsec-spoa/
log_level: info
log_compression: true
log_max_size: 100
log_max_backups: 3
log_max_age: 30

## LAPI configuration
update_frequency: 10s
api_url: http://127.0.0.1:8080/
api_key: ${API_KEY}
insecure_skip_verify: false

## SPOA listener configuration
# Configure TCP and/or Unix socket listeners
listen_tcp: 0.0.0.0:9000
listen_unix: /run/crowdsec-spoa/spoa.sock
# Use 0.0.0.0:9100 instead if HAProxy runs on a different host or container
# than this bouncer (e.g. the split haproxy/spoa containers in docker-compose.yaml) -
# 127.0.0.1 only works when both processes share the same network namespace.
challenge_http_listen: 127.0.0.1:9100
# Caps how many pending AppSec challenge responses can be held in memory at once,
# awaiting HAProxy's fetch over the challenge HTTP backend above. Defaults to 1000
# when unset, which comfortably covers legitimate traffic (at the 30s cache TTL,
# that's ~33 newly issued challenges per second sustained) while still bounding
# worst-case memory instead of letting it grow unbounded under a flood of
# challenge-triggering requests that never complete their fetch. Once full, the
# oldest still-pending entry is evicted to make room for a new one.
#challenge_cache_max_entries: 1000
#asn_database_path: /var/lib/crowdsec/data/GeoLite2-ASN.mmdb
#city_database_path: /var/lib/crowdsec/data/GeoLite2-City.mmdb

## Global AppSec configuration (optional)
## Used for virtual patching and JavaScript challenge decisions.
#appsec_url: http://127.0.0.1:7422/
#appsec_timeout: 200ms

prometheus:
  enabled: false
  listen_addr: 127.0.0.1
  listen_port: 60601

## pprof debug endpoint for runtime profiling
## WARNING: Only enable for debugging, exposes internal runtime data

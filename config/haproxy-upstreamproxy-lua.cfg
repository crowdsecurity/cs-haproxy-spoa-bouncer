# https://www.haproxy.com/documentation/hapee/latest/onepage/#home
# HAProxy configuration example for deployment behind upstream proxy
# This config extracts real client IP from X-Real-IP header (set by nginx, Cloudflare, etc.)

global
    log stdout format raw local0
    tune.bufsize 65536  # 64KB - SPOE challenge bodies are streamed from the bouncer HTTP backend
    stats socket /tmp/haproxy.sock mode 660 level admin
    stats timeout 30s
    lua-prepend-path /usr/lib/crowdsec-haproxy-spoa-bouncer/lua/?.lua
    lua-load /usr/lib/crowdsec-haproxy-spoa-bouncer/lua/crowdsec.lua
    setenv CROWDSEC_BAN_TEMPLATE_PATH /var/lib/crowdsec-haproxy-spoa-bouncer/html/lua/ban.html
    setenv CROWDSEC_CAPTCHA_TEMPLATE_PATH /var/lib/crowdsec-haproxy-spoa-bouncer/html/lua/captcha.html

defaults
    log global
    option httplog
    option http-buffer-request
    timeout client 1m
	timeout server 1m
	timeout connect 10s
	timeout http-keep-alive 2m
	timeout queue 15s
	timeout tunnel 4h  # for websocket

frontend test
    mode http
    bind *:9090
    
    unique-id-format %[uuid()]
    unique-id-header X-Unique-ID
    
    # Extract real client IP from proxy headers (runs before SPOE groups)
    # This allows SPOE groups to use src-ip=src which will have the correct IP
    # Priority: X-Real-IP > CF-Connecting-IP > X-Forwarded-For > direct src
    http-request set-src hdr_ip(X-Real-IP) if { req.hdr(X-Real-IP) -m found }
    http-request set-src hdr_ip(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found } !{ req.hdr(X-Real-IP) -m found }
    http-request set-src hdr_ip(X-Forwarded-For) if { req.hdr(X-Forwarded-For) -m found } !{ req.hdr(X-Real-IP) -m found } !{ req.hdr(CF-Connecting-IP) -m found }
    
    filter spoe engine crowdsec config /etc/haproxy/crowdsec.cfg
    acl crowdsec_challenge_backend_path path_beg /crowdsec-challenge/ /crowdsec-internal/challenge/

    # /crowdsec-internal/challenge/* bypasses the normal SPOE crowdsec-tcp/http
    # checks below (it's how the bouncer relays challenge follow-up asset/proof
    # requests to AppSec without re-triggering a fresh challenge decision), so it
    # gets no dataset-based IP check from CrowdSec at that layer. Rate-limit it
    # here independently, in addition to the IP/dataset ban check the bouncer
    # itself now performs in handleInternalChallengeHTTP.
    stick-table type ip size 100k expire 10s store http_req_rate(10s)
    http-request track-sc0 src if crowdsec_challenge_backend_path
    http-request deny status 429 if crowdsec_challenge_backend_path { sc_http_req_rate(0) gt 20 }

    # ACL for body size limit (100000 bytes = ~100KB) - adjust here to change limit globally
    # Note spop protocol has limitations on the size of the message, so altering this value will not ensure the whole
    # body is sent for processing but should be enough to prevent overwhelming the SPOA bouncer.
    acl body_within_limit req.body_size -m int le 51200  # 50KB - stay safely under SPOE frame limit

    # Debug headers to verify IP extraction
    http-request set-header X-Debug-Direct-IP %[src]

    ## If you dont want to render any content, you can use the following line
    # tcp-request content reject if !{ var(txn.crowdsec.remediation) -m str "allow" }

    ## Drop ban requests before http handler is called
    # tcp-request content reject if { var(txn.crowdsec.remediation) -m str "ban" }

    # Send HTTP group conditionally based on body size
    # Only the HTTP handler is used in upstream proxy mode to ensure the real client IP (from headers) is checked.
    # The TCP handler still runs via on-client-session event, but checks the proxy IP before http-request set-src
    # extracts the real IP from headers, so HTTP handler always re-checks with the correct IP.
    # Send group with body when body size <= limit (or no body present)
    http-request send-spoe-group crowdsec crowdsec-http-body if !crowdsec_challenge_backend_path body_within_limit || !crowdsec_challenge_backend_path !{ req.body_size -m found }
    # Send group without body when body exists and size > limit
    http-request send-spoe-group crowdsec crowdsec-http-no-body if !crowdsec_challenge_backend_path !body_within_limit { req.body_size -m found }

    ## Set a custom header on the request for upstream services to use
    http-request set-header X-Crowdsec-Remediation %[var(txn.crowdsec.remediation)] if { var(txn.crowdsec.remediation) -m found }
    ## Set a custom header on the request for upstream services to use
    http-request set-header X-Crowdsec-IsoCode %[var(txn.crowdsec.isocode)] if { var(txn.crowdsec.isocode) -m found }

    ## Handle 302 redirect for successful captcha validation (redirect to current request URL)
    http-request redirect code 302 location %[url] if { var(txn.crowdsec.remediation) -m str "allow" } { var(txn.crowdsec.redirect) -m found }
    
    acl is_challenge var(txn.crowdsec.remediation) -m str "challenge"
    http-request set-path %[var(txn.crowdsec.challenge_url)] if is_challenge { var(txn.crowdsec.challenge_url) -m found }

    ## Challenge pages and support assets are streamed from the bouncer HTTP backend,
    ## not reassembled inside HAProxy/Lua. Lua remains responsible for captcha/ban
    ## remediations in this example.
    http-request lua.crowdsec_handle if { var(txn.crowdsec.remediation) -m str "captcha" }
    http-request lua.crowdsec_handle if { var(txn.crowdsec.remediation) -m str "ban" }

    ## Handle captcha cookie management via HAProxy (new approach)
    ## Set captcha cookie when SPOA provides captcha_status (pending or valid)
    http-after-response set-header Set-Cookie %[var(txn.crowdsec.captcha_cookie)] if { var(txn.crowdsec.captcha_status) -m found } { var(txn.crowdsec.captcha_cookie) -m found }
    ## Clear captcha cookie when cookie exists but no captcha_status (Allow decision)
    http-after-response set-header Set-Cookie %[var(txn.crowdsec.captcha_cookie)] if { var(txn.crowdsec.captcha_cookie) -m found } !{ var(txn.crowdsec.captcha_status) -m found }

    # REQUIRED if you use challenge mode - do not remove this line.
    # X-Crowdsec-Real-Src is the ONLY way the bouncer learns who the visitor is on the
    # challenge backend: that path deliberately bypasses SPOE, so no src-ip arrives, and
    # the connection the bouncer sees comes from HAProxy rather than the browser. Without
    # this header the bouncer refuses every challenge request with 403 (it logs once,
    # naming this directive) rather than guessing - guessing would both skip the ban check
    # and hand AppSec this proxy's address as the client IP, corrupting allowlist and
    # country evaluation and raising AppSec events against your own infrastructure.
    #
    # Overwrite (not append) any client-supplied value: %[src] at this point already
    # reflects the trusted-proxy-header rewrite above, and becomes the sole trusted
    # source IP for the challenge backend's ban check and the RemoteIP it forwards to
    # AppSec (see trustedChallengeClientIP in pkg/spoa/root.go). "option forwardfor" on
    # the crowdsec-challenge backend below appends rather than replaces an existing
    # X-Forwarded-For, so that header must not be read directly.
    http-request set-header X-Crowdsec-Real-Src %[src] if crowdsec_challenge_backend_path

    use_backend crowdsec-challenge if is_challenge { var(txn.crowdsec.challenge_url) -m found }
    use_backend crowdsec-challenge if crowdsec_challenge_backend_path

    use_backend test_backend

backend test_backend
    mode http
    server s1 whoami:2020
    
backend crowdsec-spoa
    mode tcp
    timeout connect 2s
    timeout server 60s
    server s2 spoa:9000

backend crowdsec-challenge
    mode http
    option forwardfor
    timeout connect 2s
    timeout server 60s
    server s3 spoa:9100

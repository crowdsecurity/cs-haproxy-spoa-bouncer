# https://www.haproxy.com/documentation/hapee/latest/onepage/#home
# HAProxy configuration example for deployment behind upstream proxy
# This config extracts real client IP from X-Real-IP header (set by nginx, Cloudflare, etc.)

global
    log stdout format raw local0
    tune.bufsize 1310720  # 1.25MiB - must fit the fully reassembled challenge body (up to maxChallengeChunks*challengeChunkSize); crowdsec.cfg pins the SPOE frame size separately
    lua-prepend-path /usr/lib/crowdsec-haproxy-spoa-bouncer/lua/?.lua
    lua-load /usr/lib/crowdsec-haproxy-spoa-bouncer/lua/crowdsec.lua
    setenv CROWDSEC_BAN_TEMPLATE_PATH /var/lib/crowdsec-haproxy-spoa-bouncer/html/lua/ban.html
    setenv CROWDSEC_CAPTCHA_TEMPLATE_PATH /var/lib/crowdsec-haproxy-spoa-bouncer/html/lua/captcha.html
    stats socket /tmp/haproxy.sock mode 660 level admin
    stats timeout 30s

defaults
    log global
    option httplog
    option http-buffer-request
    timeout client 1m
	timeout server 1m
	timeout connect 10s
	timeout http-keep-alive 2m
	timeout queue 15s
	timeout tunnel 4h  # for websocket

frontend test
    mode http
    bind *:9090
    
    unique-id-format %[uuid()]
    unique-id-header X-Unique-ID
    
    # Extract real client IP from proxy headers (runs before SPOE groups)
    # This allows SPOE groups to use src-ip=src which will have the correct IP
    # Priority: X-Real-IP > CF-Connecting-IP > X-Forwarded-For > direct src
    http-request set-src hdr_ip(X-Real-IP) if { req.hdr(X-Real-IP) -m found }
    http-request set-src hdr_ip(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found } !{ req.hdr(X-Real-IP) -m found }
    http-request set-src hdr_ip(X-Forwarded-For) if { req.hdr(X-Forwarded-For) -m found } !{ req.hdr(X-Real-IP) -m found } !{ req.hdr(CF-Connecting-IP) -m found }
    
    filter spoe engine crowdsec config /etc/haproxy/crowdsec.cfg
    
    # ACL for body size limit (100000 bytes = ~100KB) - adjust here to change limit globally
    # Note spop protocol has limitations on the size of the message, so altering this value will not ensure the whole
    # body is sent for processing but should be enough to prevent overwhelming the SPOA bouncer.
    acl body_within_limit req.body_size -m int le 51200  # 50KB - stay safely under SPOE frame limit

    # HTML-capable client detection. Clients without an Accept header are treated as HTML-capable.
    # '-m sub text/html' covers the common case; '*/*' covers wildcard acceptors.
    # html_rejected excludes clients that include text/html but mark it as not acceptable (q=0).
    acl render_html req.hdr_cnt(Accept) eq 0
    acl render_html req.hdr(Accept) -m sub text/html
    acl render_html req.hdr(Accept) -m sub */*
    # Single-quoted (not double-quoted): HAProxy expands $VAR references inside double-quoted
    # strings, and this regex's own trailing "$" (end-of-line anchor) would otherwise be
    # misparsed as the start of an environment variable reference.
    acl html_rejected req.hdr(Accept) -m reg -i 'text/html[[:space:]]*;[[:space:]]*q=0(\.0+)?([,[:space:]]|$)'

    acl has_contact_url var(txn.crowdsec.contact_us_url) -m found
    acl empty_contact_url var(txn.crowdsec.contact_us_url) -m str ""

    # Debug headers to verify IP extraction
    http-request set-header X-Debug-Direct-IP %[src]

    ## If you dont want to render any content, you can use the following line
    # tcp-request content reject if !{ var(txn.crowdsec.remediation) -m str "allow" }

    ## Drop ban requests before http handler is called
    # tcp-request content reject if { var(txn.crowdsec.remediation) -m str "ban" }

    # Send HTTP group conditionally based on body size
    # Only the HTTP handler is used in upstream proxy mode to ensure the real client IP (from headers) is checked.
    # The TCP handler still runs via on-client-session event, but checks the proxy IP before http-request set-src
    # extracts the real IP from headers, so HTTP handler always re-checks with the correct IP.
    # Send group with body when body size <= limit (or no body present)
    http-request send-spoe-group crowdsec crowdsec-http-body if body_within_limit || !{ req.body_size -m found }
    # Send group without body when body exists and size > limit
    http-request send-spoe-group crowdsec crowdsec-http-no-body if !body_within_limit { req.body_size -m found }

    ## Set a custom header on the request for upstream services to use
    http-request set-header X-Crowdsec-Remediation %[var(txn.crowdsec.remediation)] if { var(txn.crowdsec.remediation) -m found }
    ## Set a custom header on the request for upstream services to use
    http-request set-header X-Crowdsec-IsoCode %[var(txn.crowdsec.isocode)] if { var(txn.crowdsec.isocode) -m found }

    ## Handle 302 redirect for successful captcha validation (redirect to current request URL)
    http-request redirect code 302 location %[url] if { var(txn.crowdsec.remediation) -m str "allow" } { var(txn.crowdsec.redirect) -m found }
    acl is_challenge var(txn.crowdsec.remediation) -m str "challenge"
    acl challenge_want_more var(txn.crowdsec.challenge_want_more) -m bool

    ## AppSec challenge bodies can exceed the 64KB SPOE frame limit, so the bouncer splits
    ## them into <=60KB chunks (see challengeChunkSize/maxChallengeChunks in pkg/spoa/root.go)
    ## and hands them back one at a time. HAProxy config has no dynamic loop construct, so this
    ## fetch loop is unrolled up to maxChallengeChunks iterations; each iteration is a no-op
    ## once challenge_want_more comes back false (or remediation isn't "challenge" at all).
    ## challenge_want_more is a separate variable from the bouncer's own challenge_chunk_more:
    ## it's only updated as the LAST step of an iteration (after collecting that iteration's
    ## chunk), so the same value gates both the fetch and the collect step within one
    ## iteration - the bouncer's response can't flip the gate out from under the collect step.
    http-request set-var(txn.crowdsec.challenge_chunk_index) int(0) if is_challenge
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge
    http-request lua.crowdsec_collect_chunk if is_challenge
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(1) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(2) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(3) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(4) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(5) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(6) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(7) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(8) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(9) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(10) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(11) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(12) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(13) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(14) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(15) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(16) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(17) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(18) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    http-request set-var(txn.crowdsec.challenge_chunk_index) int(19) if is_challenge challenge_want_more
    http-request send-spoe-group crowdsec crowdsec-challenge-chunk if is_challenge challenge_want_more
    http-request lua.crowdsec_collect_chunk if is_challenge challenge_want_more
    http-request set-var(txn.crowdsec.challenge_want_more) var(txn.crowdsec.challenge_chunk_more) if is_challenge challenge_want_more

    ## Call lua script for challenge remediation only - ban/captcha are rendered natively below,
    ## via http-request return, since their bodies are static templates with no embedded
    ## newlines-containing dynamic content (see the git history for why challenge can't be).
    http-request lua.crowdsec_handle if is_challenge

    ## Render ban and captcha remediations with native HAProxy templates.
    ## Template paths are fixed at /var/lib/crowdsec-haproxy-spoa-bouncer/html/; edit the lf-file
    ## directives below if you need custom locations (the old CROWDSEC_*_TEMPLATE_PATH env vars
    ## are not read by this non-Lua config).
    http-request return status 200 content-type "text/html; charset=utf-8" hdr Cache-Control "no-cache, no-store" lf-file /var/lib/crowdsec-haproxy-spoa-bouncer/html/captcha.html if { var(txn.crowdsec.remediation) -m str "captcha" } render_html !html_rejected
    http-request return status 403 content-type "text/html; charset=utf-8" hdr Cache-Control "no-cache, no-store" lf-file /var/lib/crowdsec-haproxy-spoa-bouncer/html/ban-with-contact.html if { var(txn.crowdsec.remediation) -m str "ban" } render_html !html_rejected has_contact_url !empty_contact_url
    http-request return status 403 content-type "text/html; charset=utf-8" hdr Cache-Control "no-cache, no-store" lf-file /var/lib/crowdsec-haproxy-spoa-bouncer/html/ban.html if { var(txn.crowdsec.remediation) -m str "ban" } render_html !html_rejected !has_contact_url
    http-request return status 403 content-type "text/html; charset=utf-8" hdr Cache-Control "no-cache, no-store" lf-file /var/lib/crowdsec-haproxy-spoa-bouncer/html/ban.html if { var(txn.crowdsec.remediation) -m str "ban" } render_html !html_rejected empty_contact_url
    ## Non-HTML clients get plain-text responses; captcha returns 200 to preserve the old
    ## Lua handler's status code (captcha is a challenge, not a hard rejection).
    http-request return status 200 content-type text/plain hdr Cache-Control "no-cache, no-store" string "Captcha required\n" if { var(txn.crowdsec.remediation) -m str "captcha" } !render_html
    http-request return status 200 content-type text/plain hdr Cache-Control "no-cache, no-store" string "Captcha required\n" if { var(txn.crowdsec.remediation) -m str "captcha" } html_rejected
    http-request return status 403 content-type text/plain hdr Cache-Control "no-cache, no-store" string "Forbidden\n" if { var(txn.crowdsec.remediation) -m str "ban" } !render_html
    http-request return status 403 content-type text/plain hdr Cache-Control "no-cache, no-store" string "Forbidden\n" if { var(txn.crowdsec.remediation) -m str "ban" } html_rejected

    ## Handle captcha cookie management via HAProxy (new approach)
    ## Set captcha cookie when SPOA provides captcha_status (pending or valid)
    http-after-response set-header Set-Cookie %[var(txn.crowdsec.captcha_cookie)] if { var(txn.crowdsec.captcha_status) -m found } { var(txn.crowdsec.captcha_cookie) -m found }
    ## Clear captcha cookie when cookie exists but no captcha_status (Allow decision)
    http-after-response set-header Set-Cookie %[var(txn.crowdsec.captcha_cookie)] if { var(txn.crowdsec.captcha_cookie) -m found } !{ var(txn.crowdsec.captcha_status) -m found }

    use_backend test_backend

backend test_backend
    mode http
    server s1 whoami:2020
    
backend crowdsec-spoa
    mode tcp
    timeout connect 2s
    timeout server 60s
    server s2 spoa:9000
